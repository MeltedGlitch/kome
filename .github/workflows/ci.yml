name: ci

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck bats locales scdoc groff-base
          # A comma-decimal locale, to test that output never depends on it.
          sudo locale-gen es_ES.UTF-8
      - name: Lint and test
        run: make check
      - name: Man pages are up to date
        # Compare the pages as rendered text: different scdoc versions write
        # equivalent roff (e.g. .P instead of .PP) that reads the same.
        run: |
          for src in doc/man/*.scd; do
            page=${src%.scd}
            scdoc <"$src" | groff -t -man -Tutf8 -P-cbou >/tmp/new.txt
            groff -t -man -Tutf8 -P-cbou "$page" >/tmp/old.txt
            diff -u /tmp/old.txt /tmp/new.txt || { echo "$page is out of date: run 'make man'"; exit 1; }
          done
