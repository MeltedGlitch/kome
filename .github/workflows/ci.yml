name: ci

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck bats locales scdoc
          # A comma-decimal locale, to test that output never depends on it.
          sudo locale-gen es_ES.UTF-8
      - name: Lint and test
        run: make check
      - name: Man pages are up to date
        run: |
          touch doc/man/*.scd
          make man
          # Ignore the "Generated by scdoc <version>" line: CI may have another version.
          git diff --exit-code -I "Generated by scdoc" doc/man
