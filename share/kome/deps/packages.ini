# Ingredient → package name, per package manager. Data for humans only:
# kome prints install commands from it and never runs them (principle 7).
#
# Sections are the ingredient names units print from `check`. Keys are
# package managers (dnf, apt, pacman, zypper); `url=` is where to get an
# ingredient no listed manager packages. Only names verified against the
# distribution's own package index belong here.

[font:Inter]
dnf=rsms-inter-fonts
apt=fonts-inter
pacman=inter-font
url=https://rsms.me/inter/

[font:JetBrains Mono]
dnf=jetbrains-mono-fonts
apt=fonts-jetbrains-mono
pacman=ttf-jetbrains-mono
url=https://www.jetbrains.com/lp/mono/
