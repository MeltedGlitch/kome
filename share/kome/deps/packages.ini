# Ingredient → package name, per package manager. Data for humans only:
# kome prints install commands from it and never runs them (principle 7).
#
# Sections are the ingredient names units print from `check`. Keys are
# package managers (dnf, apt, pacman, zypper); `install=` is a per-user
# shell command for ingredients no manager packages (printed, never run);
# `url=` is where to read about it. Only names verified against the
# distribution's own package index belong here.

[font:Inter]
dnf=rsms-inter-fonts
apt=fonts-inter
pacman=inter-font
url=https://rsms.me/inter/

[font:JetBrains Mono]
dnf=jetbrains-mono-fonts
apt=fonts-jetbrains-mono
pacman=ttf-jetbrains-mono
url=https://www.jetbrains.com/lp/mono/

# Catppuccin cursors: not packaged by the major distributions. Installed per
# user: the release zip unpacks into ~/.local/share/icons/.
[cursor:catppuccin-mocha-lavender-cursors]
install=curl -fL -o /tmp/kome-cursors.zip https://github.com/catppuccin/cursors/releases/latest/download/catppuccin-mocha-lavender-cursors.zip && mkdir -p ~/.local/share/icons && unzip -o /tmp/kome-cursors.zip -d ~/.local/share/icons && rm /tmp/kome-cursors.zip
url=https://github.com/catppuccin/cursors

[cursor:catppuccin-latte-blue-cursors]
install=curl -fL -o /tmp/kome-cursors.zip https://github.com/catppuccin/cursors/releases/latest/download/catppuccin-latte-blue-cursors.zip && mkdir -p ~/.local/share/icons && unzip -o /tmp/kome-cursors.zip -d ~/.local/share/icons && rm /tmp/kome-cursors.zip
url=https://github.com/catppuccin/cursors

[icons:Papirus-Dark]
dnf=papirus-icon-theme
apt=papirus-icon-theme
pacman=papirus-icon-theme
url=https://github.com/PapirusDevelopmentTeam/papirus-icon-theme

[icons:Papirus-Light]
dnf=papirus-icon-theme
apt=papirus-icon-theme
pacman=papirus-icon-theme
url=https://github.com/PapirusDevelopmentTeam/papirus-icon-theme
