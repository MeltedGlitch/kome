# Soft — screen-optimised UI font, crisp monospace.

[Style]
Format=1
font_ui=Inter
font_mono=JetBrains Mono
font_size=10
# Window decoration (needs Klassy; without it windows keep their frame).
decoration=klassy
window_radius=8
window_buttons=circles
buttons_left=M
buttons_right=IAX
# Plasma style and widget style (Klassy's, optional), effects.
plasma_style=klassy
widget_style=klassy
blur=on
animation_speed=fast
# Panel layout, only if the panel unit is on (panel=on in kome.conf):
# a floating dock centred at the bottom.
panel=dock
