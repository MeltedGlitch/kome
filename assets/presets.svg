<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 330" width="1280" height="330" role="img" aria-labelledby="t d">
  <title id="t">kome v0.1 presets</title>
  <desc id="d">Four presets drawn as small windows in their real colours: Breeze, Breeze Dark, Catppuccin Latte and Catppuccin Mocha.</desc>
  <defs>
    <style>
      .name { font: 600 22px Inter, 'Noto Sans', 'Segoe UI', Helvetica, Arial, sans-serif; }
      .cmd  { font: 16px 'JetBrains Mono', 'Noto Sans Mono', Menlo, Consolas, monospace; }
    </style>
  </defs>

  <!--
    One card = a mini window (titlebar, sidebar, content lines, accent
    button) plus a swatch row. Each <g> sets the preset's real colours.
  -->

  <!-- Breeze -->
  <g transform="translate(16 16)">
    <rect width="296" height="230" rx="14" fill="#eff0f1" stroke="#bdc3c7"/>
    <path d="M0 14a14 14 0 0 1 14-14h268a14 14 0 0 1 14 14v22H0z" fill="#dee0e2"/>
    <circle cx="20" cy="18" r="5" fill="#da4453"/><circle cx="38" cy="18" r="5" fill="#fdbc4b"/><circle cx="56" cy="18" r="5" fill="#27ae60"/>
    <rect x="12" y="48" width="70" height="130" rx="8" fill="#fcfcfc"/>
    <rect x="22" y="62" width="50" height="8" rx="4" fill="#3daee9"/>
    <rect x="22" y="80" width="40" height="8" rx="4" fill="#7f8c8d"/>
    <rect x="22" y="98" width="46" height="8" rx="4" fill="#7f8c8d"/>
    <rect x="94" y="48" width="190" height="130" rx="8" fill="#fcfcfc"/>
    <rect x="106" y="62" width="140" height="10" rx="5" fill="#232629"/>
    <rect x="106" y="82" width="160" height="8" rx="4" fill="#7f8c8d"/>
    <rect x="106" y="98" width="120" height="8" rx="4" fill="#7f8c8d"/>
    <rect x="106" y="140" width="76" height="26" rx="8" fill="#3daee9"/>
    <g transform="translate(14 200)">
      <circle r="8" fill="#da4453"/><circle cx="24" r="8" fill="#f67400"/><circle cx="48" r="8" fill="#fdbc4b"/><circle cx="72" r="8" fill="#27ae60"/>
      <circle cx="96" r="8" fill="#1abc9c"/><circle cx="120" r="8" fill="#3daee9"/><circle cx="144" r="8" fill="#9b59b6"/>
    </g>
    <text class="name" x="4" y="282" fill="#8c8fa1">Breeze</text>
    <text class="cmd" x="4" y="306" fill="#8c8fa1">kome apply breeze</text>
  </g>

  <!-- Breeze Dark -->
  <g transform="translate(332 16)">
    <rect width="296" height="230" rx="14" fill="#2a2e32" stroke="#4d4d4d"/>
    <path d="M0 14a14 14 0 0 1 14-14h268a14 14 0 0 1 14 14v22H0z" fill="#31363b"/>
    <circle cx="20" cy="18" r="5" fill="#da4453"/><circle cx="38" cy="18" r="5" fill="#fdbc4b"/><circle cx="56" cy="18" r="5" fill="#27ae60"/>
    <rect x="12" y="48" width="70" height="130" rx="8" fill="#1b1e20"/>
    <rect x="22" y="62" width="50" height="8" rx="4" fill="#3daee9"/>
