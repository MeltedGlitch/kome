    <rect x="94" y="48" width="190" height="130" rx="8" fill="#181825"/>
    <rect x="106" y="62" width="140" height="10" rx="5" fill="#cdd6f4"/>
    <rect x="106" y="82" width="160" height="8" rx="4" fill="#6c7086"/>
    <rect x="106" y="98" width="120" height="8" rx="4" fill="#6c7086"/>
    <rect x="106" y="140" width="76" height="26" rx="8" fill="#b4befe"/>
    <g transform="translate(14 200)">
      <circle r="8" fill="#f5e0dc"/><circle cx="24" r="8" fill="#f5c2e7"/><circle cx="48" r="8" fill="#cba6f7"/><circle cx="72" r="8" fill="#f38ba8"/>
      <circle cx="96" r="8" fill="#fab387"/><circle cx="120" r="8" fill="#f9e2af"/><circle cx="144" r="8" fill="#a6e3a1"/><circle cx="168" r="8" fill="#94e2d5"/>
      <circle cx="192" r="8" fill="#89dceb"/><circle cx="216" r="8" fill="#89b4fa"/><circle cx="240" r="8" fill="#b4befe"/>
    </g>
    <text class="name" x="4" y="282" fill="#8c8fa1">Catppuccin Mocha</text>
    <text class="cmd" x="4" y="306" fill="#8c8fa1">kome apply mocha</text>
  </g>
</svg>
