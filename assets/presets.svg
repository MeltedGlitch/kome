    <rect x="22" y="80" width="40" height="8" rx="4" fill="#9ca0b0"/>
    <rect x="22" y="98" width="46" height="8" rx="4" fill="#9ca0b0"/>
    <rect x="94" y="48" width="190" height="130" rx="8" fill="#e6e9ef"/>
    <rect x="106" y="62" width="140" height="10" rx="5" fill="#4c4f69"/>
    <rect x="106" y="82" width="160" height="8" rx="4" fill="#9ca0b0"/>
    <rect x="106" y="98" width="120" height="8" rx="4" fill="#9ca0b0"/>
    <rect x="106" y="140" width="76" height="26" rx="8" fill="#1e66f5"/>
    <g transform="translate(14 200)">
      <circle r="8" fill="#dc8a78"/><circle cx="24" r="8" fill="#ea76cb"/><circle cx="48" r="8" fill="#8839ef"/><circle cx="72" r="8" fill="#d20f39"/>
      <circle cx="96" r="8" fill="#fe640b"/><circle cx="120" r="8" fill="#df8e1d"/><circle cx="144" r="8" fill="#40a02b"/><circle cx="168" r="8" fill="#179299"/>
      <circle cx="192" r="8" fill="#04a5e5"/><circle cx="216" r="8" fill="#1e66f5"/><circle cx="240" r="8" fill="#7287fd"/>
    </g>
    <text class="name" x="4" y="282" fill="#8c8fa1">Catppuccin Latte</text>
    <text class="cmd" x="4" y="306" fill="#8c8fa1">kome apply latte</text>
  </g>

  <!-- Catppuccin Mocha -->
  <g transform="translate(964 16)">
    <rect width="296" height="230" rx="14" fill="#1e1e2e" stroke="#45475a"/>
    <path d="M0 14a14 14 0 0 1 14-14h268a14 14 0 0 1 14 14v22H0z" fill="#181825"/>
    <circle cx="20" cy="18" r="5" fill="#f38ba8"/><circle cx="38" cy="18" r="5" fill="#f9e2af"/><circle cx="56" cy="18" r="5" fill="#a6e3a1"/>
