    <text class="cmd" x="4" y="306" fill="#8c8fa1">kome apply breeze-dark</text>
  </g>

  <!-- Catppuccin Latte -->
  <g transform="translate(648 16)">
    <rect width="296" height="230" rx="14" fill="#eff1f5" stroke="#ccd0da"/>
    <path d="M0 14a14 14 0 0 1 14-14h268a14 14 0 0 1 14 14v22H0z" fill="#e6e9ef"/>
    <circle cx="20" cy="18" r="5" fill="#d20f39"/><circle cx="38" cy="18" r="5" fill="#df8e1d"/><circle cx="56" cy="18" r="5" fill="#40a02b"/>
